<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOKEALOT</title>
  <meta name="description" content="Fullstack Roblox programmer — combat, skills, UI, VFX and backend systems.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Shippori+Mincho:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <div class="texture" aria-hidden="true"></div>

  <header class="nav">
    <a class="brand" href="#home"><span class="brand-kanji" data-cfg="kanjiLogo"></span><span class="brand-name" data-cfg="name"></span></a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
    <nav class="nav-links">
      <a href="#home" class="is-active">Home</a>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="nav-social" id="navSocial"></div>
  </header>

  <main>
    <!-- 01 HERO -->
    <section id="home" class="hero section">
      <div class="art art-hero" data-img="hero"></div>
      <div class="art art-figure" data-img="heroFigure"></div>
      <div class="hero-grid">
        <div class="hero-copy reveal">
          <div class="label"><span class="num">01</span><span class="rule"></span><span data-cfg="subtitle"></span></div>
          <h1 class="hero-name" data-cfg="name"></h1>
          <p class="hero-intro" data-cfg="heroIntro"></p>
          <div class="btn-row">
            <a class="btn btn-primary" href="#projects">View My Work <span class="arrow">→</span></a>
            <a class="btn" href="#contact">Contact Me <span class="arrow">→</span></a>
          </div>
          <p class="tagline">“<span data-cfg="tagline"></span>”<span class="stroke"></span></p>
        </div>
        <div class="hero-insets">
          <div class="inset" data-img="heroInsetA"></div>
          <div class="inset" data-img="heroInsetB"></div>
        </div>
        <aside class="side-note side-note-hero">
          <span class="jp-vertical" data-jp="hero.vertical"></span>
          <span class="jp-quote" data-jp="hero.quote"></span>
          <ul class="jp-list" data-jp-list="hero.list"></ul>
          <span class="side-rule"></span>
        </aside>
      </div>
    </section>

    <!-- 02 ABOUT + 03 SKILLS -->
    <div class="row-2">
      <section id="about" class="about section">
        <div class="art art-about" data-img="about"></div>
        <div class="art art-figure art-figure-about" data-img="aboutFigure"></div>
        <div class="section-head reveal"><span class="num">02</span><h2>About Me</h2><span class="rule"></span></div>
        <div class="about-body reveal">
          <p data-cfg="about"></p>
          <p class="muted" data-cfg="aboutExtra"></p>
          <div class="stats" id="stats"></div>
        </div>
        <aside class="side-note side-note-about">
          <span class="jp-vertical" data-jp="about.vertical"></span>
          <ul class="jp-list" data-jp-list="about.list"></ul>
        </aside>
      </section>

      <section id="skills" class="skills section">
        <div class="art art-skills" data-img="skills"></div>
        <div class="art art-figure art-figure-skills" data-img="skillsFigure"></div>
        <div class="section-head reveal"><span class="num">03</span><h2>Skills</h2><span class="rule"></span></div>
        <div class="skill-grid reveal" id="skillGrid"></div>
        <p class="quote-line reveal"><span class="stroke"></span><span data-jp="skills.quote"></span></p>
      </section>
    </div>

    <!-- 04 PROJECTS -->
    <section id="projects" class="projects section">
      <div class="art art-projects" data-img="projects"></div>
        <div class="art art-figure art-figure-projects" data-img="projectsFigure"></div>
      <aside class="side-note side-note-projects">
        <span class="jp-vertical" data-jp="projects.vertical"></span>
        <ul class="jp-list" data-jp-list="projects.list"></ul>
      </aside>
      <div class="projects-inner">
        <div class="section-head reveal">
          <span class="num">04</span><h2>Projects</h2>
          <div class="filters" id="filters" role="tablist"></div>
          <a class="view-all" href="#" id="viewAll">View All <span class="arrow">→</span></a>
        </div>
        <div class="project-grid" id="projectGrid"></div>
      </div>
    </section>

    <!-- 05 CONTACT -->
    <section id="contact" class="contact section">
      <div class="art art-contact" data-img="contact"></div>
      <div class="section-head reveal"><span class="num">05</span><h2>Contact</h2></div>
      <div class="contact-body reveal">
        <h3>Let's Work Together</h3>
        <p class="muted" id="contactLine"></p>
        <div class="social-grid" id="socialGrid"></div>
      </div>
      <aside class="side-note side-note-contact">
        <span class="jp-vertical" data-jp="contact.vertical"></span>
        <ul class="jp-list" data-jp-list="contact.list"></ul>
      </aside>
    </section>
  </main>

  <footer class="footer"><span data-cfg="name"></span> · built for Roblox</footer>

  <!-- video overlay -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="Video">
      <button class="modal-close" data-close aria-label="Close">×</button>
      <div class="modal-frame" id="modalFrame"></div>
      <p class="modal-title" id="modalTitle"></p>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
